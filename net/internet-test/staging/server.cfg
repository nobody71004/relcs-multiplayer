# reLCS staging server config — internet test (see ../RUNBOOK.md)
# Keys are parsed by net/server/main.cpp ApplyKeyVal; CLI -key value overrides.

hostname=reLCS Staging
port=7777
maxplayers=32
gamemode=survivor

# master announce (bool! master host/port are separate keys)
announce=1
master=127.0.0.1
master_port=7800

# LAN discovery is a raw-UDP broadcast — pointless (and noisy) on a VPS
lan_discover=0

# admin rcon (rides UDP 7777 in-band). Rotate before internet tests and keep
# this file out of public repos.
rcon_password=CHANGE_ME_staging

# gameplay baseline (same as the LAN VM)
tick_rate=20
stream_distance=250
hour=12
minute=0
weather=0
profiles=profiles.db
netstats_interval=60
