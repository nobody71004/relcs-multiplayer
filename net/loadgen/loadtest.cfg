# loadtest.cfg — 2k-player load profile for relcs-loadgen fleets.
#
#   cd net/bin/Release
#   ./reLCS-server.exe -config ../../loadgen/loadtest.cfg
#
# Bots are ENet clients without an EOS identity, so anti-cheat must be off:
# with eac=1 + ac_require=1 every unauthenticated bot is removed after
# ac_grace seconds and the run measures the kick path instead of the server.
hostname=reLCS loadtest
port=7900
maxplayers=2000
gamemode=freeroam
announce=0
lan_discover=0
profiles=
resources=
vehicles=
tick_rate=20
stream_distance=200
netstats_interval=1
log_file=server-load.log
eac=0
ac_require=0
