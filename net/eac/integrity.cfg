#-------------------------------------------
# reLCS — Anti-Cheat Integrity Tool config
# Signed base catalogue: EasyAntiCheat/Certificates/base.bin
#-------------------------------------------
config_info:
{
    version = 2;
};
search_options:
{
    # hash everything: game data archives are the interesting part
    exclude_size_threshold = 0;

    exclude_paths = [
        "EasyAntiCheat\\Certificates\\base.*",
        "EasyAntiCheat\\Licenses",
        "EasyAntiCheat\\Localization",
        "EasyAntiCheat\\*.log",
        "logs",
        "screenshots",
        "eos-cache"
    ];

    exclude_extensions = [
        ".bak",
        ".bat",
        ".bmp",
        ".cfg",
        ".db",
        ".eac",
        ".ico",
        ".inf",
        ".ini",
        ".jpg",
        ".last",
        ".log",
        ".manifest",
        ".mdb",
        ".pdb",
        ".png",
        ".pubkey",
        ".tmp",
        ".txt",
        ".vdf",
        ".xml",
        ".zip"
    ];

    ignore_files_without_extension = false;
};
runtime_configuration:
{
    # one protected game instance per machine
    max_active_game_instances = 1;
};
